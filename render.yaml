services:
  - type: web
    name: profe-ingles
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: FLASK_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 2
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

